<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 15 380 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- 1. Top Wing Gradient -->
    <linearGradient id="iconTopWingGrad" x1="0.88" y1="0.05" x2="0.12" y2="0.95">
      <stop offset="0%" stop-color="#FFE70B" />
      <stop offset="18%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF5D00" />
      <stop offset="82%" stop-color="#F22200" />
      <stop offset="100%" stop-color="#CE1400" />
    </linearGradient>

    <!-- Top Wing Specular Sheen -->
    <linearGradient id="iconTopWingSheen" x1="0.25" y1="0.0" x2="0.75" y2="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#FFF275" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#FFA800" stop-opacity="0" />
    </linearGradient>

    <!-- 2. Second Wing Gradient -->
    <linearGradient id="iconSecondWingGrad" x1="0.9" y1="0.15" x2="0.1" y2="0.85">
      <stop offset="0%" stop-color="#FF3820" />
      <stop offset="35%" stop-color="#E81242" />
      <stop offset="70%" stop-color="#C20456" />
      <stop offset="100%" stop-color="#880050" />
    </linearGradient>

    <!-- 3. Third Wing / Magenta Bar -->
    <linearGradient id="iconMagentaBarGrad" x1="0.0" y1="0.5" x2="1.0" y2="0.35">
      <stop offset="0%" stop-color="#55006E" />
      <stop offset="20%" stop-color="#880072" />
      <stop offset="52%" stop-color="#CE006E" />
      <stop offset="80%" stop-color="#F81880" />
      <stop offset="100%" stop-color="#FF4098" />
    </linearGradient>

    <!-- Magenta Bar Top Highlight -->
    <linearGradient id="iconMagentaTopHighlight" x1="0.0" y1="0.0" x2="1.0" y2="0.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#FFA6D0" stop-opacity="0.55" />
      <stop offset="75%" stop-color="#FF5C9E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <!-- 4. Fourth Layer: Blue Wave -->
    <linearGradient id="iconBlueWaveGrad" x1="0.05" y1="0.1" x2="0.95" y2="0.65">
      <stop offset="0%" stop-color="#00EEFF" />
      <stop offset="32%" stop-color="#00A8FF" />
      <stop offset="72%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0044DB" />
    </linearGradient>

    <!-- Blue Wave Crest Highlight -->
    <linearGradient id="iconBlueWaveHighlight" x1="0.1" y1="0.0" x2="0.85" y2="0.8">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#70F5FF" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#0099FF" stop-opacity="0" />
    </linearGradient>

    <!-- 5. Blue Vertical Stem -->
    <linearGradient id="iconBlueStemGrad" x1="0.5" y1="0.0" x2="0.5" y2="1.0">
      <stop offset="0%" stop-color="#0094FF" />
      <stop offset="45%" stop-color="#0066FF" />
      <stop offset="80%" stop-color="#004AE0" />
      <stop offset="100%" stop-color="#0035B5" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="iconLayerShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1A0022" flood-opacity="0.32" />
    </filter>
    <filter id="iconTopWingShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <filter id="iconSecondWingShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-1" dy="4" stdDeviation="4" flood-color="#280010" flood-opacity="0.28" />
    </filter>
    <filter id="iconBlueWaveShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#001438" flood-opacity="0.36" />
    </filter>
    <filter id="iconPixelTileShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- LAYER 2: Red / Crimson Feather -->
  <g filter="url(#iconSecondWingShadow)">
    <path
      d="M 132 230
         C 132 148 168 96 215 76
         C 256 58 316 66 355 92
         C 378 107 386 122 383 134
         C 378 145 352 153 318 156
         C 260 162 200 178 165 212
         C 146 230 137 252 132 270
         Z"
      fill="url(#iconSecondWingGrad)"
    />
  </g>

  <!-- LAYER 1: Top Yellow / Golden Wing -->
  <g filter="url(#iconTopWingShadow)">
    <path
      d="M 132 255
         C 132 138 185 46 260 38
         C 322 32 376 34 412 38
         C 416 39 416 44 413 46
         C 388 70 355 106 300 118
         C 238 131 182 146 132 255
         Z"
      fill="url(#iconTopWingGrad)"
    />
    <path
      d="M 148 225
         C 152 138 195 60 262 46
         C 318 36 370 38 406 41
         C 372 63 342 88 295 100
         C 238 114 182 138 148 225
         Z"
      fill="url(#iconTopWingSheen)"
    />
  </g>

  <!-- LAYER 5: Vertical Blue Stem -->
  <path
    d="M 132 245
       C 132 288 131 338 131 365
       L 160 365
       L 160 393
       L 188 393
       C 192 380 193 370 193 358
       C 205 342 215 316 215 278
       C 215 252 214 238 214 228
       Z"
    fill="url(#iconBlueStemGrad)"
  />

  <!-- LAYER 4: Cyan / Blue Wave -->
  <g filter="url(#iconBlueWaveShadow)">
    <path
      d="M 132 278
         C 140 240 176 218 220 213
         C 268 208 315 210 334 216
         C 342 219 340 228 332 235
         C 305 256 262 270 215 270
         C 178 270 146 292 132 318
         Z"
      fill="url(#iconBlueWaveGrad)"
    />
    <path
      d="M 152 270
         C 182 238 230 223 280 220
         C 310 218 328 221 334 223
         C 312 238 276 252 230 254
         C 188 256 162 268 152 270
         Z"
      fill="url(#iconBlueWaveHighlight)"
    />
  </g>

  <!-- LAYER 3: Magenta Bar -->
  <g filter="url(#iconLayerShadow)">
    <path
      d="M 132 172
         C 168 162 225 157 282 157
         C 336 157 368 159 378 163
         C 384 166 383 174 377 180
         C 356 201 322 217 275 219
         C 220 221 168 225 132 276
         Z"
      fill="url(#iconMagentaBarGrad)"
    />
    <path
      d="M 135 175
         C 172 166 228 161 282 161
         C 334 161 364 163 374 165
         C 360 177 334 191 286 194
         C 232 197 174 202 135 242
         Z"
      fill="url(#iconMagentaTopHighlight)"
    />
  </g>

  <!-- LAYER 6: The Digital Pixel Mosaic -->
  <g filter="url(#iconPixelTileShadow)">
    <rect x="104" y="281" width="28" height="28" fill="#F59E0B" />
    <rect x="132" y="281" width="28" height="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="76" y="309" width="28" height="28" fill="#18181B" />
    <rect x="104" y="309" width="28" height="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="132" y="309" width="28" height="28" fill="#F59E0B" />
    <rect x="160" y="309" width="28" height="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="104" y="337" width="28" height="28" fill="#F472B6" />
  </g>
</svg>
